<section class="page-heading"><div><span class="eyebrow">THE THINGS YOU'RE LEARNING</span><h1>Your courses.</h1><p>Keep classes, assignments, exams and focused time connected to each course.</p></div><button class="button button-blue" data-toggle-panel="subjectFormPanel">＋ Add course</button></section>
<section class="surface-card form-panel hidden-panel" id="subjectFormPanel"><form id="subjectForm" class="form-row"><label class="form-field"><span>Course name</span><input name="name" required maxlength="120" placeholder="e.g. Web Technology"></label><label class="form-field"><span>Category</span><input name="category" maxlength="80" value="Core"></label><label class="form-field"><span>Difficulty · 1–5</span><input name="difficulty" type="number" min="1" max="5" value="3"></label><label class="form-field"><span>Study target · hours</span><input name="target_hours" type="number" min="0" max="500" step="0.5" value="4"></label><button class="button button-blue form-submit" type="submit">Add to my courses ↗</button></form></section>
<p class="form-footnote">Tip: Each course can have its own quiz. Use the “Create quiz” link on a course card.</p>
<section class="subject-grid" id="subjectList"><div class="loading-shimmer"></div></section>
