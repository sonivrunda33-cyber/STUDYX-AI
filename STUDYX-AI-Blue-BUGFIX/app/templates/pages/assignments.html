<section class="page-heading"><div><span class="eyebrow">THE NEXT RIGHT THING</span><h1>Assignments.</h1><p>Keep deadlines clear and break work into a manageable next step. Every due date is also added to your calendar.</p></div><button class="button button-blue" data-toggle-panel="assignmentFormPanel">＋ Add assignment</button></section>
<section class="surface-card form-panel hidden-panel" id="assignmentFormPanel"><div class="section-heading"><div><span class="eyebrow">PUT IT ON YOUR PLAN</span><h2>New assignment</h2></div></div><form id="assignmentForm" class="form-grid"><label class="form-field wide"><span>Assignment name</span><input name="title" required maxlength="180" placeholder="e.g. Finish statistics assignment"></label><label class="form-field"><span>Course</span><select name="subject_id" data-subject-options><option value="">Choose course</option></select></label><label class="form-field"><span>Due date & time</span><input name="due_at" type="datetime-local" required></label><label class="form-field"><span>Priority</span><select name="priority"><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select></label><label class="form-field"><span>Estimated minutes</span><input name="estimated_minutes" type="number" min="5" max="720" value="45"></label><label class="form-field wide"><span>Notes <i>optional</i></span><textarea name="description" rows="2" maxlength="4000"></textarea></label><button class="button button-blue form-submit" type="submit">Save assignment ↗</button></form></section>
<section class="list-toolbar"><div class="filter-tabs"><button class="active" data-assignment-filter="all">All work</button><button data-assignment-filter="todo">To do</button><button data-assignment-filter="done">Completed</button></div><span id="assignmentCount">—</span></section><section id="assignmentList" class="task-list"><div class="loading-shimmer"></div></section>
